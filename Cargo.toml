[workspace]
members = [
    "schemars",
    "schemars_derive"
]
resolver = "2"

[workspace.dependencies]
oxc-schemars = { version = "0.9.2", path = "schemars" }
oxc_schemars_derive = { version = "0.8.27", path = "schemars_derive" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
