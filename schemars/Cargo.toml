[package]
name = "oxc-schemars"
description = "Generate JSON Schemas from Rust code"
repository = "https://github.com/oxc-project/schemars"
version = "0.9.1"
authors = ["Graham Esau <gesau@hotmail.co.uk>"]
edition = "2021"
license = "MIT"
readme = "README.md"
keywords = ["rust", "json-schema", "serde"]
categories = ["encoding"]
rust-version = "1.71"

[lib]
name = "schemars"

[dependencies]
oxc_schemars_derive = { workspace = true, optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.25"
dyn-clone = "1.0"

indexmap2 = { version = "2.0", features = [
    "serde",
], optional = true, package = "indexmap" }
regex = { version = "1.12", optional = true }

[dev-dependencies]
pretty_assertions = "1.2.1"
trybuild = "1.0"

[features]
default = ["derive"]

derive = ["dep:oxc_schemars_derive"]

[[test]]
name = "indexmap2"
required-features = ["indexmap2"]

[[test]]
name = "regex"
required-features = ["regex"]
