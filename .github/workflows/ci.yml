name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: taiki-e/checkout-action@83ed61bfbe2b8abbb3c66e8b65b1335484c70009 # v1.4.1
      - uses: oxc-project/setup-rust@4f86b5d871ae7d24bc420e578be68964ab09e5cc # v1.0.15
        with:
          save-cache: ${{ github.ref_name == 'main' }}
          cache-key: warm
      - name: Check with no feature flags
        run: cargo check --verbose --no-default-features
        working-directory: ./schemars
      - name: Run tests
        run: cargo test --verbose --all-features --no-fail-fast
        working-directory: ./schemars
      - name: Run derive tests
        run: cargo test --verbose --all-features --no-fail-fast
        working-directory: ./schemars_derive
